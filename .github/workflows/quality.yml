name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, 'codex/qa-**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/superagente
      QA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lyn_qa_retest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: superagente
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d superagente"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Create isolated integration database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lyn_qa_retest;'
      - run: npm run migrate
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm audit --omit=dev
        working-directory: backend

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend

  evolution:
    name: Evolution compatibility and security
    runs-on: ubuntu-latest
    env:
      DATABASE_PROVIDER: postgresql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evolution-api/package-lock.json
      - run: npm ci
        working-directory: evolution-api
      - run: npm run db:generate
        working-directory: evolution-api
      - run: npm run build
        working-directory: evolution-api
      - run: node --test scripts/tests/dependency-compatibility.test.mjs
      - run: node --test scripts/tests/webhook-batches.test.mjs
      - run: node scripts/check-dashboard.cjs
      - run: npm audit --omit=dev
        working-directory: evolution-api

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: node --test scripts/tests/release-safety.test.mjs
      - name: Package and verify extension
        shell: pwsh
        run: |
          ./extension/scripts/package-extension.ps1
          $package = 'extension/dist/lyn-superagente-extension.zip'
          if (!(Test-Path $package)) {
            throw 'No se generó el paquete de extensión.'
          }
          $verificationDirectory = Join-Path $env:RUNNER_TEMP 'lyn-extension-verification'
          Expand-Archive -LiteralPath $package -DestinationPath $verificationDirectory -Force
          foreach ($requiredFile in @('manifest.json', 'src/background/service-worker.js', 'src/sidepanel/sidepanel.html', 'scripts/icons/icon128.png')) {
            if (!(Test-Path (Join-Path $verificationDirectory $requiredFile))) {
              throw "El paquete no contiene $requiredFile."
            }
          }
          node --check (Join-Path $verificationDirectory 'src/background/service-worker.js')
          $manifest = Get-Content -Raw (Join-Path $verificationDirectory 'manifest.json') | ConvertFrom-Json
          if ($manifest.version -notmatch '^\d+\.\d+\.\d+$' -or !$manifest.permissions.Contains('sidePanel')) {
            throw 'El manifiesto empaquetado no cumple la configuración de panel lateral esperada.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: lyn-superagente-extension
          path: extension/dist/lyn-superagente-extension.zip
          if-no-files-found: error
