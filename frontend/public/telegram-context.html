<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram · Superagente LYN</title>
<style>body{font:16px system-ui;background:#f7f8fa;color:#172033;margin:0}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;gap:24px;align-items:center}a{color:#a34711}h1{margin:0;font-size:26px}.muted{color:#5a6577}button,select{font:inherit;padding:10px;border:1px solid #c8cfda;border-radius:7px;background:white}button{cursor:pointer}button.primary{background:#a34711;color:white;border:0}button:disabled{opacity:.5;cursor:wait}.panel{background:white;border:1px solid #dbe0e8;border-radius:12px;padding:20px;margin:16px 0}.filters{display:flex;gap:12px;flex-wrap:wrap}#groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.group{text-align:left;display:block;width:100%}.badge{display:inline-block;border-radius:6px;padding:3px 8px;background:#e5f3fd;color:#0d547f;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.5}.message{padding:14px 0;border-top:1px solid #e3e7ed}small{color:#5a6577}#status{min-height:24px;color:#913d13}label{display:flex;gap:8px;align-items:center}#messages{max-height:520px;overflow:auto}</style>
<header><a href="/">← Superagente LYN</a><h1>Conversaciones de obra <span class="badge">Telegram</span></h1></header><main>
<p class="muted">Grupos de prueba vinculados a la base central de interacciones. Acceso con la sesión administradora del Superagente.</p><p id="status" role="status"></p>
<section class="panel"><div class="filters"><label>Obra <select id="project"><option value="">Todas</option></select></label><label>Cliente <select id="client"><option value="">Todos</option></select></label><button id="reload">Actualizar</button></div></section><section id="groups"></section>
<section class="panel" id="detail" hidden><h2 id="title"></h2><p class="badge">Origen: Telegram</p><div class="filters"><label>Desde <input id="from" type="datetime-local"></label><label>Hasta <input id="to" type="datetime-local"></label><button id="applyPeriod">Aplicar periodo</button></div><p id="messageScope" class="muted"></p><button id="earlier" hidden>Cargar mensajes anteriores</button><div id="messages"></div><hr><label>Agente existente <select id="specialist"><option value="">Cargando agentes…</option></select><button class="primary" id="analyze">Analizar conversación</button></label><p class="muted">Se envía el texto enmascarado. Las fotos y documentos se conservan como adjuntos; no se interpretan con IA.</p><pre id="analysis"></pre></section>
<script>
const $=id=>document.getElementById(id);let conversations=[],selected,detailRequest=0,messageCursor=null,visibleMessages=[],appliedPeriod={};
async function api(path,body){const token=localStorage.getItem('ceo_token');if(!token)throw Error('Inicia sesión en el Superagente y vuelve a esta página.');const r=await fetch('/api/telegram/context/'+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok){if(r.status===422){const data=await r.json();throw Error(data.error==='telegram_evidence_not_verified'?'No se pudo verificar la evidencia del análisis. El resultado no se ha aceptado. Revisa los mensajes o vuelve a intentarlo.':data.error==='telegram_context_too_large'?'El periodo supera 1.000 mensajes. Acota las fechas y vuelve a analizar; no se ha enviado un resumen parcial.':'No hay texto o transcripciones disponibles para analizar.');}throw Error(r.status===401?'La sesión ha caducado. Inicia sesión en el Superagente.':r.status===403?'Esta vista requiere permisos de administración.':'No se pudo completar la operación. Revisa el servicio y su configuración.');}return r.json();}
function status(text){$('status').textContent=text;}
function options(id,rows,key,label){const current=$(id).value;$(id).replaceChildren(new Option(id==='project'?'Todas':'Todos',''));const seen=new Set;for(const r of rows)if(r[key]&&!seen.has(r[key])){seen.add(r[key]);$(id).add(new Option(r[label]||r[key],r[key]));}$(id).value=current;}
function render(){const rows=conversations.filter(r=>(!$('project').value||r.proyecto_id===$('project').value)&&(!$('client').value||r.cliente_id===$('client').value));if(selected&&!rows.some(r=>r.chat_id===selected.chat_id)){selected=undefined;detailRequest++;$('detail').hidden=true;$('messages').replaceChildren();$('analysis').textContent='';status('');}$('groups').replaceChildren();for(const r of rows){const b=document.createElement('button');b.className='group panel';b.textContent=(r.project_name||'Obra')+' · '+(r.client_name||'Equipo / autor sin cliente')+' · '+r.message_count+' mensajes · Telegram';b.onclick=()=>open(r);$('groups').append(b);}if(!rows.length)status('No hay conversaciones para los filtros seleccionados.');else if($('status').textContent==='No hay conversaciones para los filtros seleccionados.')status('');}
async function load(){try{status('Cargando…');const [groups,agents]=await Promise.all([api('conversations'),api('specialists')]);conversations=groups.conversations;$('specialist').replaceChildren();for(const agent of agents.specialists||[])$('specialist').add(new Option(agent.name,agent.id));if([...$('specialist').options].some(o=>o.value==='general'))$('specialist').value='general';$('analyze').disabled=!$('specialist').options.length;options('project',conversations,'proyecto_id','project_name');options('client',conversations,'cliente_id','client_name');render();if(conversations.length)status('Conversaciones de prueba en la base central.');}catch(e){status(e.message);}}
function renderMessages(){
 $('messages').replaceChildren();
for(const m of visibleMessages){const box=document.createElement('div');box.className='message';const label=document.createElement('small');label.textContent=new Date(m.timestamp).toLocaleString('es')+' · '+m.remitente+' · '+m.tipo;const p=document.createElement('pre');p.textContent=m.texto||(m.media?.state==='non_downloadable'?'Adjunto no descargable · '+m.media.file_size+' bytes':'Adjunto · '+(m.media?.state||'pendiente'));box.append(label,p);if(m.media?.storage_sha256){const b=document.createElement('button');b.textContent='Descargar adjunto';b.onclick=async()=>{try{const r=await fetch('/api/telegram/context/attachment/'+encodeURIComponent(m.id),{headers:{authorization:'Bearer '+localStorage.getItem('ceo_token')}});if(!r.ok)throw Error('No se pudo descargar el adjunto.');const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='adjunto-telegram';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}catch(e){status(e.message);}};box.append(b);}$('messages').append(box);}
 $('earlier').hidden=!messageCursor;
 $('messageScope').textContent=visibleMessages.length+' mensajes cargados'+(Object.keys(appliedPeriod).length?' en el periodo seleccionado':'')+(messageCursor?' · Hay mensajes anteriores.':' · Inicio de la conversación.');
}
async function messagePage(row,request,before){
 const data=await api('messages?chatId='+encodeURIComponent(row.chat_id)+(before?'&before='+encodeURIComponent(before):'')+Object.entries(appliedPeriod).map(([key,value])=>'&'+key+'='+encodeURIComponent(value)).join(''));
 if(request!==detailRequest||selected?.chat_id!==row.chat_id)return;
 messageCursor=data.nextCursor||null;visibleMessages=before?[...data.messages,...visibleMessages]:data.messages;renderMessages();status('');
}
async function open(row){const request=++detailRequest;try{selected=row;messageCursor=null;visibleMessages=[];$('earlier').hidden=true;$('messageScope').textContent='Cargando mensajes…';$('detail').hidden=false;$('title').textContent=row.project_name||'Obra';$('analysis').textContent='';$('messages').replaceChildren();await messagePage(row,request,null);}catch(e){if(request===detailRequest)status(e.message);}}
$('earlier').onclick=async()=>{if(!selected||!messageCursor)return;const row=selected,request=detailRequest;$('earlier').disabled=true;try{await messagePage(row,request,messageCursor);}catch(e){if(request===detailRequest)status(e.message);}finally{$('earlier').disabled=false;}};
$('analyze').onclick=async()=>{if(!selected||!$('specialist').value)return;const chatId=selected.chat_id,request=detailRequest;$('analysis').textContent='';$('analyze').disabled=true;try{status('Preparando contexto enmascarado y consultando al agente…');const r=await api('analyze',{chatId,specialistId:$('specialist').value,...appliedPeriod});if(request!==detailRequest||selected?.chat_id!==chatId)return;$('analysis').textContent='Origen: '+r.source+' · '+r.model+(r.messageCount?' · '+r.messageCount+' mensajes analizados':'')+'\n\n'+r.text;status('Análisis guardado. La salida enviada al agente consta en el registro de privacidad.');}catch(e){if(request===detailRequest)status(e.message);}finally{$('analyze').disabled=false;}};
$('applyPeriod').onclick=()=>{const range={};for(const key of ['from','to']){const input=$(key).value;if(input){const date=new Date(input);if(!Number.isFinite(date.valueOf())){status('Revisa las fechas del periodo.');return;}range[key]=date.toISOString();}}if(range.from&&range.to&&range.from>range.to){status('La fecha inicial debe ser anterior a la final.');return;}appliedPeriod=range;if(selected)open(selected);};
$('reload').onclick=load;$('project').onchange=render;$('client').onchange=render;load();
</script></main></html>
