<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LYN Superagente</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: #0d0f12;
      color: #f2f2f2;
      width: 360px;
      min-height: 520px;
    }
    .header {
      border-bottom: 1px solid #2a3942;
      padding: 14px 16px;
      background: #111b21;
    }
    .title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #00a884;
    }
    .subtitle {
      margin: 4px 0 0;
      font-size: 11px;
      color: #8696a0;
    }
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #2a3942;
    }
    .section-title {
      margin: 0 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #8696a0;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid #2a3942;
      background: #111b21;
      padding: 6px 10px;
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.ok { background: #10b981; }
    .dot.warn { background: #f59e0b; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: #202c33;
      color: #f2f2f2;
      padding: 10px 12px;
      font-size: 12px;
    }
    button.primary {
      background: #00a884;
      border-color: #00a884;
      color: #000;
      font-weight: 600;
    }
    button.danger {
      background: #7f1d1d;
      border-color: #7f1d1d;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metric {
      border-radius: 10px;
      border: 1px solid #2a3942;
      background: #0d0d0d;
      padding: 10px;
      text-align: center;
    }
    .metric-value {
      font-size: 18px;
      font-weight: 700;
      color: #f2f2f2;
    }
    .metric-label {
      margin-top: 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #8696a0;
    }
    .empty {
      color: #737373;
      font-size: 12px;
    }
    .error {
      color: #ef4444;
      font-size: 12px;
    }
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .chat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: #111b21;
      padding: 8px;
      cursor: pointer;
    }
    .chat-item.group-chat {
      border-color: #1d5a6e;
      background: #0f1d23;
    }
    .chat-item.group-chat .chat-name {
      color: #4ecdc4;
    }
    .chat-item.active {
      border-color: #00a884;
      background: #202c33;
    }
    .chat-name {
      font-size: 13px;
      font-weight: 600;
      color: #f2f2f2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-meta {
      font-size: 11px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-pill {
      border-radius: 999px;
      background: #00a884;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      min-width: 24px;
      text-align: center;
    }
    .select {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: #0d0d0d;
      color: #f2f2f2;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .textarea {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: #0d0d0d;
      color: #f2f2f2;
      padding: 8px;
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .reply-actions {
      display: flex;
      gap: 8px;
    }
    .reply-actions button {
      flex: 1;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #2a3942;
    }
    .tab {
      flex: 1;
      background: transparent;
      border: none;
      color: #8696a0;
      padding: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
    }
    .tab.active {
      color: #f2f2f2;
      border-bottom: 2px solid #00a884;
    }
    .panel {
      padding: 12px 16px;
    }
    .panel.hidden {
      display: none;
    }
    .qr-image {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #2a3942;
      background: #0d0d0d;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">LYN Superagente</div>
    <div class="subtitle">Extensión conectada a Evolution API</div>
    <label class="badge" style="cursor:pointer;margin-top:8px;" title="Modo privacidad: leer sin marcar como leído">
      <input type="checkbox" id="popup-privacy-mode" style="accent-color:#00a884;cursor:pointer;" />
      <span>👁️ Modo privacidad</span>
    </label>
  </div>

  <div class="tabs">
    <button class="tab active" data-panel="panel-summary">Resumen</button>
    <button class="tab" data-panel="panel-reply">Responder</button>
    <button class="tab" data-panel="panel-chats">Chats</button>
  </div>

  <div id="panel-summary" class="panel">
    <div class="section-title">Especialista</div>
    <select id="specialist-summary" class="select"></select>
    <div class="actions">
      <button id="btn-summary" class="primary">Resumir</button>
      <button id="btn-reply" class="primary">Responder</button>
    </div>
    <div id="summary-output" class="empty">Seleccioná un chat, un especialista y presioná Resumir.</div>
  </div>

  <div id="panel-reply" class="panel hidden">
    <div class="section-title">Especialista</div>
    <select id="specialist-reply" class="select"></select>
    <button id="btn-generate-reply" class="primary" style="width:100%;">Generar respuesta</button>
    <textarea id="reply-text" class="textarea" placeholder="Editá la respuesta antes de enviarla..."></textarea>
    <div class="reply-actions">
      <button id="btn-copy">Copiar</button>
      <button id="btn-regenerate">Regenerar</button>
      <button id="btn-send" class="primary">Enviar respuesta</button>
    </div>
    <div id="reply-output" class="empty" style="margin-top:10px;">Seleccioná un chat, un especialista y presioná Generar respuesta.</div>
  </div>

  <div id="panel-chats" class="panel hidden">
    <div class="row">
      <div class="badge">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Desconectado</span>
      </div>
      <button id="btn-refresh-status">Actualizar</button>
    </div>
    <button id="btn-open-qr" style="width:100%;margin-top:10px;">Abrir QR</button>
    <div id="qr-output" class="empty" style="margin-top:10px;"></div>
    <div class="section-title" style="margin-top:14px;">Chats</div>
    <button id="btn-refresh-chats" style="width:100%;">Actualizar chats</button>
    <div id="chat-list" class="chat-list" style="margin-top:8px;"></div>
    <div id="chat-messages" class="empty" style="margin-top:8px;"></div>
    <div class="section-title" style="margin-top:14px;">Historial de resúmenes</div>
    <div id="summary-history" class="chat-list" style="margin-top:8px;"></div>
    <div class="section-title" style="margin-top:14px;">Historial de respuestas</div>
    <div id="reply-history" class="chat-list" style="margin-top:8px;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
